# FastAGI Mapping - Maps FastAGI request paths to Java handlers
# 
# Each entry maps:  <path> = <class>
# 
# When Asterisk calls: agi://127.0.0.1:4573/hello
# It will invoke: gov.iti.telecom.VxmlAgiHandler
#
# The handler reads the VXML name from Asterisk variables:
# - VXML_FILE: direct VXML name (e.g., "hello", "menu-example")
# - REQUEST_PATH: inferred from AGI path
#

# Generic VXML handler (reads VXML_FILE variable)
hello=gov.iti.telecom.VxmlAgiHandler
menu=gov.iti.telecom.VxmlAgiHandler
transfer=gov.iti.telecom.VxmlAgiHandler
restaurant=gov.iti.telecom.VxmlAgiHandler
default=gov.iti.telecom.VxmlAgiHandler

# Additional FastAGI route mappings
charging=gov.iti.telecom.VxmlAgiHandler
ivr_platform=gov.iti.telecom.VxmlAgiHandler
hospital_ivr=gov.iti.telecom.VxmlAgiHandler
pizza_iv=gov.iti.telecom.VxmlAgiHandler
pizza_palace=gov.iti.telecom.VxmlAgiHandler
healthcare_iv=gov.iti.telecom.VxmlAgiHandler

